# jay.ui.yml — View Configuration
# Location: ~/.config/jay/jay.ui.yml (optional, loaded on-demand per view)
#
# This file controls per-view settings such as emoji decoration and
# animation data for views that support them.
#
# Each view has its own section under `ui:`. Only the section matching
# the active view is loaded (e.g. ui.highway when --tui highway is used).
#
# Example usage:
#   jay walk --tui highway ./src/mycode
#   jay sprint --NoW=16 ./src/mycode
#   jay sprint --tui highway --NoW=16 ./src/mycode

ui:
  highway:
    # Worker emoji pool for lane decoration (space-separated, at least 10 recommended)
    worker-emoji-pool: '😎 😄 👽 🤖 🦊 🐯 👻 🧙 🦄 🦁 🦉 🐸'

    # Job emoji pool for job arrival decoration (space-separated, at least 4 recommended)
    job-emoji-pool: '🍎 🍊 🍋 🍇 🍓 🍑 🍒 🍌 🍍 🥝'

    # Character between emoji and content info (default: single space)
    separator: ' '

    # Animation data configuration for Highway view lanes
    animation:
      # List of animation types to load on demand
      # Categories (expand to all members):
      #   film-strip-set, braille-set, charm-set, skin-set, basics-set
      # Individual spinners:
      #   wave, fairlight, amour, jamboree, musical, trinkets, morse,
      #   starlight, infantry, heart-throb, barcode, bounce, spinner,
      #   braille, braillewave, dna, scan, rain, scanline, braille-pulse,
      #   snake, sparkle, cascade, columns, orbit, breathe, waverows,
      #   checkerboard, helix, fillsweep, diagswipe, car,
      #   classic-waveform, particle-drift, pulsing-rings, ascii-landscape,
      #   matrix-rain, gradient-flow, breathing-circles, network-graph,
      #   dot, jump, pulse, points, globe, moon, monkey, meter,
      #   hamburger, ellipsis
      # Empty or omitted loads all default animations
      spinners:
        enabled: ['film-strip-set', 'braille-set', 'skin-set']

        # Override per-spinner settings
        override:
          wave:
            interval: 120
          braille:
            interval: 60
